name: Sync with upstream

on:
  # Runs at 10:00 UTC every day
  schedule:
    - cron:  '0 10 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest upstream AppImage version
        id: latest
        run: |
          url=$(curl -sIL -o /dev/null -w '%{url_effective}' "https://api.lunarclientprod.com/site/download?os=linux")
          version=$(echo "$url" | grep -oP 'Lunar%20Client-\K[0-9.]+(?=-ow)')
          if [ -z "$version" ]; then
            echo "Failed to determine latest upstream version" >&2
            exit 1
          fi
          echo "Latest upstream version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch current edge channel version
        id: edge
        run: |
          version=$(curl -s -H "Snap-Device-Series: 16" \
            "https://api.snapcraft.io/v2/snaps/info/lunar-client" \
            | jq -r '[.["channel-map"][] | select(.channel.name=="edge" and .channel.architecture=="amd64")][0].version // empty')
          if [ -z "$version" ]; then
            echo "Failed to determine current edge version" >&2
            exit 1
          fi
          echo "Current edge version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Trigger snap build if a new version is available
        if: steps.latest.outputs.version != steps.edge.outputs.version
        env:
          GH_TOKEN: ${{ secrets.LUNARCLIENT_SCOPED_TOKEN }}
        run: |
          echo "New upstream version ${{ steps.latest.outputs.version }} differs from edge version ${{ steps.edge.outputs.version }}; triggering snap workflow"
          gh workflow run snap.yaml --repo "${{ github.repository }}"
